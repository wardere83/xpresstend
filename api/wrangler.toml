name = "xpresstend"
main = "src/index.ts"
compatibility_date = "2026-08-26"
compatibility_flags = ["nodejs_compat"]

# Keep the workers.dev URL live alongside the routes below. Declaring routes
# turns it off by default, and it is useful for testing a deploy before the
# domain picks it up.
workers_dev = true

# Custom domains, now that the old GitHub Pages A records are gone. Cloudflare
# creates and owns the DNS records for these, which is why it refused while
# externally managed ones existed. This is the sturdier arrangement: a route
# needs a DNS record to already resolve, so deleting one takes the site down,
# whereas a custom domain owns the record itself.
routes = [
  { pattern = "xpresstend.com", custom_domain = true },
  { pattern = "www.xpresstend.com", custom_domain = true },
]


# The Worker serves the built site as well as the API, so security headers can
# be set on every response. GitHub Pages had no way to do that.
[assets]
directory = "../dist"
binding = "ASSETS"
# Unknown paths return index.html so client-side routing survives a cold URL.
not_found_handling = "single-page-application"
# Static assets are served by the platform and skip the Worker entirely unless
# this is set, which meant the site's own HTML came back with no CSP while the
# API had one. Routing every request through the Worker is what guarantees the
# security headers land on markup, scripts and images alike.
run_worker_first = true

# Rates go stale after an hour on the quote path, so they are refreshed well
# inside that window. Four runs an hour also means a single failed fetch is
# invisible to customers: the next attempt lands long before the rate expires.
[triggers]
crons = ["*/15 * * * *"]

# The production database, in the Cloudflare account that owns xpresstend.com.
# The id is not a secret.
[[d1_databases]]
binding = "DB"
database_name = "xpresstend-production"
database_id = "5e2f3987-7795-4c4e-8acd-6ac78038f1dc"

[vars]
ENVIRONMENT = "production"
APP_ORIGIN = "https://xpresstend.com"

# Secrets are set with `wrangler secret put NAME` and never live in this file:
#   SESSION_PEPPER      extra secret mixed into every password hash
#   STRIPE_SECRET_KEY   test key until the money transmitter licence lands
#   STRIPE_WEBHOOK_SECRET
#
# Transactional email, for staff invitations and password resets. The domain is
# on Microsoft 365 (MX points at Outlook, SPF ends in -all authorising only
# Microsoft), so mail goes out through Graph. Sending through any other relay
# would fail SPF at the receiver and spam-file a password reset.
#
#   MS_TENANT_ID        Azure directory (tenant) ID
#   MS_CLIENT_ID        app registration's application (client) ID
#   MS_CLIENT_SECRET    that app's client secret
#
# The app registration needs the Mail.Send APPLICATION permission with admin
# consent granted. EMAIL_FROM is optional and defaults to
# support@xpresstend.com; whatever it is set to must be a real mailbox in the
# tenant, because Graph sends as a user rather than an arbitrary address.
#
# With none of these set, invites and resets still work: the owner is handed a
# link to pass on. Nothing breaks, it is just manual.
