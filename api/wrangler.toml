name = "xpresstend"
main = "src/index.ts"
compatibility_date = "2026-08-26"
compatibility_flags = ["nodejs_compat"]

# Keep the workers.dev URL live alongside the routes below. Declaring routes
# turns it off by default, and it is useful for testing a deploy before the
# domain picks it up.
workers_dev = true

# Routes rather than custom domains. A custom domain insists on managing the
# zone's DNS itself and refuses while records already exist, but a route simply
# intercepts matching requests ahead of the origin, which works with the proxied
# records already in place. Nothing in DNS has to be deleted.
routes = [
  { pattern = "xpresstend.com/*", zone_name = "xpresstend.com" },
  { pattern = "www.xpresstend.com/*", zone_name = "xpresstend.com" },
]


# The Worker serves the built site as well as the API, so security headers can
# be set on every response. GitHub Pages had no way to do that.
[assets]
directory = "../dist"
binding = "ASSETS"
# Unknown paths return index.html so client-side routing survives a cold URL.
not_found_handling = "single-page-application"
# Static assets are served by the platform and skip the Worker entirely unless
# this is set, which meant the site's own HTML came back with no CSP while the
# API had one. Routing every request through the Worker is what guarantees the
# security headers land on markup, scripts and images alike.
run_worker_first = true

# The production database, in the Cloudflare account that owns xpresstend.com.
# The id is not a secret.
[[d1_databases]]
binding = "DB"
database_name = "xpresstend-production"
database_id = "5e2f3987-7795-4c4e-8acd-6ac78038f1dc"

[vars]
ENVIRONMENT = "production"
APP_ORIGIN = "https://xpresstend.com"

# Secrets are set with `wrangler secret put NAME` and never live in this file:
#   SESSION_PEPPER      extra secret mixed into every password hash
#   STRIPE_SECRET_KEY   test key until the money transmitter licence lands
#   STRIPE_WEBHOOK_SECRET
