<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B252F" />
    <meta
      name="description"
      content="XpressTend Financial Services LLC is a Seattle-based cross-border payments company. Company information, compliance, security and partnership enquiries."
    />
    <title>XpressTend | Your world. Connected.</title>
    <link rel="canonical" href="https://xpresstend.com/" />
    <!-- Social card. A link to this site is forwarded far more often than it is
         typed, and a preview with no title, description or image reads as an
         unfinished site whatever the page itself says. The per-page title and
         description are written over these at runtime by src/marketing/meta.ts,
         so a forwarded compliance link previews as the compliance page. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="XpressTend" />
    <meta property="og:url" content="https://xpresstend.com/" />
    <meta property="og:title" content="XpressTend | Your world. Connected." />
    <meta
      property="og:description"
      content="XpressTend Financial Services LLC is a Seattle-based cross-border payments company. Company information, compliance, security and partnership enquiries."
    />
    <meta property="og:image" content="https://xpresstend.com/media/closer-poster.webp" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="XpressTend | Your world. Connected." />
    <meta
      name="twitter:description"
      content="XpressTend Financial Services LLC is a Seattle-based cross-border payments company. Company information, compliance, security and partnership enquiries."
    />
    <meta name="twitter:image" content="https://xpresstend.com/media/closer-poster.webp" />
    <!-- Fonts are bundled with the app rather than fetched from Google Fonts, so
         the site, the iOS app and the Android app draw exactly the same type on
         first launch and offline. Jost carries the logo only: it is a geometric
         sans in the same family as the wordmark artwork. Inter is the
         interface face and Noto Sans Arabic covers the Arabic locale. -->
    <link rel="stylesheet" href="./fonts.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
