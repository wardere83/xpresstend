const c=document.querySelector('canvas'),g=c.getContext('2d'),W=1920,H=1080;

const clamp=x=>Math.max(0,Math.min(1,x)),ease=x=>{x=clamp(x);return x*x*(3-2*x)},mix=(a,b,t)=>a+(b-a)*t;

function renderContent(t){g.globalAlpha=1;g.fillStyle='#071a22';g.fillRect(0,0,W,H);let bg=g.createRadialGradient(1320,460,0,1100,500,1200);bg.addColorStop(0,'#10323d');bg.addColorStop(1,'#071a22');g.fillStyle=bg;g.fillRect(0,0,W,H);

function render(t){
  const reveal=1.8;
  if(t>=reveal) renderContent(t-reveal+.15);
  else { g.globalAlpha=1; g.fillStyle='#020b10'; g.fillRect(0,0,W,H); }
  if(t<2.7){
    g.save();
    const extend=ease(t/1.25),open=ease((t-.65)/1.25),fade=1-ease((t-1.85)/.85);
    const y=-90+extend*H*.8,spread=12+open*1600;

    fog.addColorStop(0,`rgba(228,255,255,${.9*fade})`);fog.addColorStop(.16,`rgba(130,238,242,${.65*fade})`);fog.addColorStop(.58,`rgba(75,209,211,${.2*fade})`);fog.addColorStop(1,'rgba(75,209,211,0)');

}
