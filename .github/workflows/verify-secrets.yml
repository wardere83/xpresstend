name: Verify secrets

# Secrets are write-only, so the only way to check them is to have a runner try
# to use them and report what it found. This reports shape and validity only:
# lengths, whether a value decodes, whether a password opens a keystore. It
# never prints a value.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-secrets.yml'

permissions:
  contents: read

jobs:
  verify:
    name: Check every signing secret
    runs-on: macos-15
    env:
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - name: Report length and shape of every secret
        run: |
          set -uo pipefail
          fail=0

          # Expected sizes, so a value that is present but wrong is caught as
          # readily as one that is missing.
          check_len () {
            local name="$1" value="$2" min="$3" label="$4"
            local n=${#value}
            if [ "$n" -eq 0 ]; then
              echo "::error::$name is EMPTY ($label)"; fail=1; return
            fi
            if [ "$n" -lt "$min" ]; then
              echo "::error::$name is only $n characters, expected at least $min ($label). It looks like a path or placeholder, not the value."
              fail=1; return
            fi
            echo "::notice::$name OK, $n characters ($label)"
          }

          check_len APPLE_CERTIFICATE_P12      "$APPLE_CERTIFICATE_P12"      3000 "base64 .p12, expect ~4408"
          check_len APPLE_CERTIFICATE_PASSWORD "$APPLE_CERTIFICATE_PASSWORD"   16 "keystore password, expect ~28"
          check_len APPLE_PROVISIONING_PROFILE "$APPLE_PROVISIONING_PROFILE" 10000 "base64 profile, expect ~16368"
          check_len APPLE_TEAM_ID              "$APPLE_TEAM_ID"                10 "team id, expect 10"
          check_len APPSTORE_KEY_ID            "$APPSTORE_KEY_ID"              10 "key id, expect 10"
          check_len APPSTORE_ISSUER_ID         "$APPSTORE_ISSUER_ID"           30 "issuer UUID, expect 36"
          check_len APPSTORE_PRIVATE_KEY       "$APPSTORE_PRIVATE_KEY"        200 "base64 .p8, expect ~344"
          check_len ANDROID_KEYSTORE           "$ANDROID_KEYSTORE"           4000 "base64 keystore, expect ~5476"
          check_len ANDROID_KEYSTORE_PASSWORD  "$ANDROID_KEYSTORE_PASSWORD"    16 "keystore password, expect ~28"

          echo "LENGTH_FAIL=$fail" >> "$GITHUB_ENV"

      - name: Prove each value is what it claims to be
        run: |
          set -uo pipefail
          fail=0

          if [ -n "$APPLE_CERTIFICATE_P12" ]; then
            echo "$APPLE_CERTIFICATE_P12" | tr -d '\n\r ' | base64 --decode > /tmp/c.p12 2>/dev/null
            if openssl pkcs12 -in /tmp/c.p12 -passin "pass:$APPLE_CERTIFICATE_PASSWORD" -nokeys -noout 2>/dev/null; then
              SUBJ=$(openssl pkcs12 -in /tmp/c.p12 -passin "pass:$APPLE_CERTIFICATE_PASSWORD" -nokeys -clcerts 2>/dev/null | openssl x509 -noout -subject 2>/dev/null | head -c 120)
              echo "::notice::APPLE_CERTIFICATE_P12 decodes and the password opens it. $SUBJ"
            else
              echo "::error::APPLE_CERTIFICATE_P12 does not decode, or APPLE_CERTIFICATE_PASSWORD does not open it."
              fail=1
            fi
            rm -f /tmp/c.p12
          fi

          if [ -n "$APPLE_PROVISIONING_PROFILE" ]; then
            echo "$APPLE_PROVISIONING_PROFILE" | tr -d '\n\r ' | base64 --decode > /tmp/p.mobileprovision 2>/dev/null
            if security cms -D -i /tmp/p.mobileprovision > /tmp/p.plist 2>/dev/null; then
              NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' /tmp/p.plist 2>/dev/null)
              APPID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' /tmp/p.plist 2>/dev/null)
              EXP=$(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' /tmp/p.plist 2>/dev/null)
              echo "::notice::APPLE_PROVISIONING_PROFILE is valid. name=$NAME appid=$APPID expires=$EXP"
            else
              echo "::error::APPLE_PROVISIONING_PROFILE is not a readable provisioning profile."
              fail=1
            fi
            rm -f /tmp/p.mobileprovision /tmp/p.plist
          fi

          if [ -n "$APPSTORE_PRIVATE_KEY" ]; then
            echo "$APPSTORE_PRIVATE_KEY" | tr -d '\n\r ' | base64 --decode > /tmp/k.p8 2>/dev/null
            if openssl pkey -in /tmp/k.p8 -noout 2>/dev/null; then
              echo "::notice::APPSTORE_PRIVATE_KEY is a valid private key."
            else
              echo "::error::APPSTORE_PRIVATE_KEY is not a valid .p8 private key."
              fail=1
            fi
            rm -f /tmp/k.p8
          fi

          if [ -n "$ANDROID_KEYSTORE" ]; then
            echo "$ANDROID_KEYSTORE" | tr -d '\n\r ' | base64 --decode > /tmp/a.keystore 2>/dev/null
            if openssl pkcs12 -in /tmp/a.keystore -passin "pass:$ANDROID_KEYSTORE_PASSWORD" -nokeys -noout 2>/dev/null; then
              echo "::notice::ANDROID_KEYSTORE decodes and its password opens it."
            else
              echo "::error::ANDROID_KEYSTORE does not decode, or ANDROID_KEYSTORE_PASSWORD does not open it."
              fail=1
            fi
            rm -f /tmp/a.keystore
          fi

          if [ "$fail" = "1" ] || [ "${LENGTH_FAIL:-0}" = "1" ]; then
            echo "::error::One or more signing secrets are wrong. See the notices above for which."
            exit 1
          fi
          echo "::notice::Every signing secret is present and valid."
