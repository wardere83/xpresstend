name: Build & deploy

# The site and API are one Cloudflare Worker. GitHub Pages and the HostGator
# FTPS target are both retired: a Worker route intercepts every request to
# xpresstend.com ahead of any origin, which is what allows the security headers
# that a static host could not set.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm ci --prefix api

      - name: Lint
        run: npm run lint

      - name: Type-check the Worker
        run: npx tsc --noEmit
        working-directory: api

      - name: Money and ledger tests
        run: npm test
        working-directory: api

      - name: Build the site
        run: npm run build

      - name: Keep the built site as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 14

  deploy:
    needs: check
    runs-on: ubuntu-latest
    # Deploys only once CLOUDFLARE_API_TOKEN is present, so a fork or an
    # unconfigured checkout builds and tests without trying to publish.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm ci --prefix api
      - run: npm run build

      - name: Deploy the Worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
        working-directory: api
