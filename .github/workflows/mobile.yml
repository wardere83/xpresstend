name: Mobile builds

# Builds the apps on GitHub's runners, which already carry the Android SDK and
# Xcode. Nothing has to be installed locally, and every run leaves a downloadable
# artifact under the run's summary page.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'web/**'
      - 'public/**'
      - 'android/**'
      - 'ios/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/mobile.yml'

permissions:
  # The Android job publishes a release, whose assets are downloadable without
  # a GitHub login. Actions artifacts are not: they require one, so they cannot
  # sit behind a public download button.
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      - name: Build the web app and sync it into the native project
        run: npm run build:mobile
        env:
          # Points the app at production. Override for a staging build.
          VITE_API_URL: https://xpresstend.com/api

      - name: Assemble the debug APK
        run: ./gradlew --no-daemon assembleDebug
        working-directory: android

      - name: Upload the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: xpresstend-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Name the APK after the build
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/xpresstend.apk

      # A rolling "android-latest" release, so the site can link to a stable URL
      # that always serves the newest build.
      - name: Publish the rolling release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: XpressTend for Android
          body: |
            The latest Android build, published automatically from `main`.

            **Install:** download `xpresstend.apk`, open it on your phone and
            allow installation from unknown sources when prompted.

            This is a debug build for testing, not a Play Store release, so
            Android will warn that it is from an unknown developer.
          files: release/xpresstend.apk
          make_latest: true

  ios:
    name: iOS (compile check)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the web app and sync it into the native project
        run: npm run build:mobile
        env:
          VITE_API_URL: https://xpresstend.com/api

      # Capacitor 8 resolves its native dependencies through Swift Package
      # Manager, so there is no Podfile and no workspace: the project builds
      # directly. Unsigned, because a distributable build needs an Apple
      # Developer account and certificates.
      - name: Compile without signing
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
        working-directory: ios/App

      - name: Upload the simulator build
        uses: actions/upload-artifact@v4
        with:
          name: xpresstend-ios-simulator
          path: ios/App/build/Build/Products/Debug-iphonesimulator/App.app
          retention-days: 30
          if-no-files-found: warn

  ios-signed:
    name: iOS signed build
    runs-on: macos-15
    # Only runs once the signing secrets exist, so a fork or an unconfigured
    # checkout is not failed by their absence.
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the web app and sync it into the native project
        run: npm run build:mobile
        env:
          VITE_API_URL: https://xpresstend.com/api

      - name: Install the signing certificate and profile
        if: env.APPLE_CERTIFICATE_P12 != ''
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          # A throwaway keychain, so nothing is left behind on the runner and
          # the login keychain is never touched.
          KEYCHAIN=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PW=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"

          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign blocks on a UI prompt no one can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$APPLE_PROVISIONING_PROFILE" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/XpressTend.mobileprovision

          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Archive and export the IPA
        if: env.APPLE_CERTIFICATE_P12 != ''
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
        run: |
          set -euo pipefail
          xcodebuild -project App.xcodeproj -scheme App \
            -configuration Release -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/XpressTend.xcarchive" \
            DEVELOPMENT_TEAM=64H8428M8D \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="XpressTend App Store" \
            archive
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/XpressTend.xcarchive" \
            -exportOptionsPlist ../ci/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export"
        working-directory: ios/App

      - name: Upload the IPA
        if: env.APPLE_CERTIFICATE_P12 != ''
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
        uses: actions/upload-artifact@v4
        with:
          name: xpresstend-ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 30
          if-no-files-found: error
