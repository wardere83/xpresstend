name: Mobile builds

# Builds the apps on GitHub's runners, which already carry the Android SDK and
# Xcode. Nothing has to be installed locally, and every run leaves a downloadable
# artifact under the run's summary page.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'web/**'
      - 'public/**'
      - 'android/**'
      - 'ios/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/mobile.yml'

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      - name: Build the web app and sync it into the native project
        run: npm run build:mobile
        env:
          # Points the app at production. Override for a staging build.
          VITE_API_URL: https://xpresstend.com/api

      - name: Assemble the debug APK
        run: ./gradlew --no-daemon assembleDebug
        working-directory: android

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: xpresstend-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

  ios:
    name: iOS (compile check)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the web app and sync it into the native project
        run: npm run build:mobile
        env:
          VITE_API_URL: https://xpresstend.com/api

      - name: Install pods
        run: pod install
        working-directory: ios/App

      # Unsigned. A distributable build needs an Apple Developer account and
      # certificates, so this proves the project compiles rather than producing
      # something installable.
      - name: Compile without signing
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
        working-directory: ios/App

      - name: Upload the simulator build
        uses: actions/upload-artifact@v4
        with:
          name: xpresstend-ios-simulator
          path: ios/App/build/Build/Products/Debug-iphonesimulator/App.app
          retention-days: 30
          if-no-files-found: warn
